{% for task in tasks %}

<div class="modal fade"
     id="taskModal{{ task.id }}"
     tabindex="-1">

    <div class="modal-dialog">

        <div class="modal-content">

            <form method="POST"
                  action="{% url 'edit_task' task.id %}">

                {% csrf_token %}

                <div class="modal-header">

                    <h5 class="modal-title">
                        Edit Task
                    </h5>

                    <button
                        type="button"
                        class="btn-close"
                        data-bs-dismiss="modal">
                    </button>

                </div>


                <div class="modal-body">


                    <!-- Title -->
                    <label class="form-label">
                        Task Name
                    </label>

                    <input
                        class="form-control mb-3"
                        name="title"
                        value="{{ task.title }}">



                    <!-- Description -->
                    <label class="form-label">
                        Description
                    </label>

                    <textarea
                        class="form-control mb-3"
                        rows="4"
                        name="description">{{ task.description }}</textarea>



                    <!-- Status -->
                    <label class="form-label">
                        Status
                    </label>

                    <select
                        class="form-select mb-3"
                        name="status">

                        <option value="todo"
                        {% if task.status == "todo" %}
                            selected
                        {% endif %}>
                            To Do
                        </option>


                        <option value="active"
                        {% if task.status == "active" %}
                            selected
                        {% endif %}>
                            Active
                        </option>


                        <option value="paused"
                        {% if task.status == "paused" %}
                            selected
                        {% endif %}>
                            Paused
                        </option>


                        <option value="completed"
                        {% if task.status == "completed" %}
                            selected
                        {% endif %}>
                            Completed
                        </option>

                    </select>



                    <!-- Deadline -->
                    <label class="form-label">
                        Due By
                    </label>

                    <input
                        type="datetime-local"
                        class="form-control mb-3"
                        name="due_at"
                        {% if task.due_at %}
                        value="{{ task.due_at|date:'Y-m-d\TH:i' }}"
                        {% endif %}>



                    <!-- Focus Timer -->
                    <!-- Focus Timer -->
<label class="form-label">
    Focus Timer (minutes)
</label>

<input
    type="number"
    class="form-control mb-3"
    name="duration"
    {% if task.timer_ends_at %}
        disabled
    {% endif %}
>


{% if task.timer_ends_at %}

<div class="alert alert-success">

    <strong>▶ Timer Running</strong>

    <br>

    Ends at:
    {{ task.timer_ends_at|date:"d M Y H:i" }}

</div>

{% elif task.timer_duration %}

<div class="alert alert-secondary">

    <strong>⏱ Timer Set</strong>

    <br>

    Duration:
    {{ task.timer_duration }}

</div>

{% endif %}


                </div>


                <div class="modal-footer">

                    <button
                        class="btn btn-primary">

                        Save Changes

                    </button>

                </div>

            </form>

        </div>

    </div>

</div>

{% endfor %}
